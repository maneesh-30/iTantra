  <text x="750" y="232" font-size="17" font-weight="700" fill="#2A2118" text-anchor="middle">Talk hands-free, like a normal call.</text>
  <text x="750" y="256" font-size="13" fill="#5A6B66" text-anchor="middle">Continuous — no button; auto-detects pauses.</text>
  <text x="750" y="277" font-size="13" fill="#5A6B66" text-anchor="middle">Alerts play at maximum volume, non-stop.</text>
