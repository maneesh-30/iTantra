  <text x="250" y="232" font-size="17" font-weight="700" fill="#2A2118" text-anchor="middle">Hold to talk, release to listen.</text>
  <text x="250" y="256" font-size="13" fill="#6B5E49" text-anchor="middle">One-to-many on a shared channel — like a radio.</text>
  <text x="250" y="277" font-size="13" fill="#6B5E49" text-anchor="middle">Mic stays off when idle, saving battery.</text>

  <rect x="520" y="16" width="460" height="288" rx="18" fill="#EAF7F4"/>
  <rect x="600" y="34" width="300" height="32" rx="16" fill="#158D7C"/>
