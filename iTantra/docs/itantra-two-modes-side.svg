  <circle cx="124" cy="120" r="22" fill="#E8A317"/>
  <g stroke="#241A05" stroke-width="2.4" fill="none" stroke-linecap="round" transform="translate(124,120)"><rect x="-5" y="-9" width="10" height="14" rx="5" fill="#241A05" stroke="none"/><path d="M-8,-1 a8,8 0 0 0 16,0"/><line x1="0" y1="7" x2="0" y2="12"/></g>
  <g fill="#E8A317"><rect x="108" y="156" width="4" height="7" rx="2"/><rect x="118" y="151" width="4" height="18" rx="2"/><rect x="128" y="156" width="4" height="7" rx="2"/></g>
  <circle cx="332" cy="108" r="25" fill="#33291C"/><circle cx="332" cy="114" r="21" fill="#E8B48C"/>
