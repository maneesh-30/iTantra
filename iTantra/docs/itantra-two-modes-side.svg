  <rect x="572" y="82" width="104" height="104" rx="14" fill="#241A05"/>
  <circle cx="624" cy="118" r="17" fill="#158D7C"/>
  <g fill="#fff" transform="translate(624,118)"><circle cx="0" cy="-5" r="5.5"/><path d="M-8,8 q8,-10 16,0 Z"/></g>
  <text x="624" y="156" font-size="11" fill="#7FBFB4" text-anchor="middle">00:12</text>
  <rect x="808" y="112" width="12" height="50" rx="6" fill="#33291C"/><rect x="852" y="112" width="12" height="50" rx="6" fill="#33291C"/>
