  <circle cx="98" cy="490" r="5" fill="#22C55E"/><text x="120" y="496" font-size="19" fill="#1F2A44">3–4 languages</text>
  <circle cx="98" cy="534" r="5" fill="#22C55E"/><text x="120" y="540" font-size="19" fill="#1F2A44">Measure accuracy &amp; latency</text>
