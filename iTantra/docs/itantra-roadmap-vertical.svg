  <circle cx="98" cy="222" r="5" fill="#3B82F6"/><text x="120" y="228" font-size="19" fill="#1F2A44">Offline two-phone loop</text>
  <circle cx="98" cy="262" r="5" fill="#3B82F6"/><text x="120" y="268" font-size="19" fill="#1F2A44">Walkie-talkie + alerts</text>

  <line x1="350" y1="312" x2="350" y2="342" stroke="#64748B" stroke-width="2" marker-end="url(#dn)"/>

