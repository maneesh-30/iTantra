  <text x="292" y="50" font-size="14" font-weight="700" fill="#241A05" text-anchor="middle">Walkie-talkie mode</text>
  <text x="270" y="96" font-size="17" font-weight="700" fill="#2A2118">Hold to talk, release to listen.</text>
  <text x="270" y="122" font-size="13" fill="#6B5E49">One-to-many on a shared channel — like a radio.</text>
  <text x="270" y="150" font-size="13" fill="#6B5E49">Mic stays off when idle, saving battery.</text>

