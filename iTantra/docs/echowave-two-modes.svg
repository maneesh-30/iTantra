<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, Segoe UI, Roboto, sans-serif">
  <title>Two communication modes: Push-to-Talk walkie-talkie and continuous Phone Mode.</title>
  <desc>Left card push-to-talk, right card phone mode.</desc>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#1F2A37">Two ways to talk</text>

  <rect x="40" y="76" width="440" height="360" rx="16" fill="#F2F7FD" stroke="#1971C2"/>
  <circle cx="260" cy="150" r="42" fill="#DCEBFB"/>
  <g stroke="#1971C2" stroke-width="2.6" fill="none" stroke-linecap="round" transform="translate(260,150)">
    <rect x="-9" y="-22" width="18" height="30" rx="9"/>
    <path d="M-15,-2 a15,15 0 0 0 30,0"/>
    <line x1="0" y1="13" x2="0" y2="21"/>
    <line x1="-9" y1="21" x2="9" y2="21"/>
    <path d="M20,-16 a12,12 0 0 1 0,22" stroke-width="2"/>
    <path d="M-20,-16 a12,12 0 0 0 0,22" stroke-width="2"/>
  </g>
  <text x="260" y="228" font-size="21" font-weight="700" fill="#12518F" text-anchor="middle">Push-to-Talk</text>
  <rect x="176" y="240" width="168" height="24" rx="12" fill="#DCEBFB"/>
  <text x="260" y="256" font-size="12" font-weight="600" fill="#12518F" text-anchor="middle">walkie-talkie style</text>
  <g font-size="15" fill="#3A4657">
    <text x="80" y="302">•  Hold the button to talk</text>
    <text x="80" y="336">•  One-to-many on a shared channel</text>
    <text x="80" y="370">•  Mic off when idle — saves battery</text>
    <text x="80" y="404">•  Half-duplex (one speaks at a time)</text>
  </g>

  <rect x="520" y="76" width="440" height="360" rx="16" fill="#ECF7F5" stroke="#2FA79A"/>
  <circle cx="740" cy="150" r="42" fill="#D6F0EC"/>
  <g stroke="#2FA79A" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(740,150)">
    <rect x="-30" y="-20" width="22" height="40" rx="4"/>
    <rect x="8" y="-20" width="22" height="40" rx="4"/>
    <path d="M-8,0 q4,-9 8,0 t8,0" stroke-width="2.2"/>
  </g>
  <text x="740" y="228" font-size="21" font-weight="700" fill="#1B6B33" text-anchor="middle">Phone Mode</text>
  <rect x="640" y="240" width="200" height="24" rx="12" fill="#D6F0EC"/>
  <text x="740" y="256" font-size="12" font-weight="600" fill="#1B6B33" text-anchor="middle">continuous conversation</text>
  <g font-size="15" fill="#3A4657">
    <text x="560" y="302">•  Hands-free — no button to hold</text>
    <text x="560" y="336">•  Talk across connected devices</text>
    <text x="560" y="370">•  Auto-detects pauses (VAD)</text>
    <text x="560" y="404">•  For back-and-forth conversation</text>
  </g>

  <text x="500" y="452" font-size="13" fill="#6B7280" text-anchor="middle">Both run on the same offline, text-relay engine — only text crosses the link.</text>
</svg>
