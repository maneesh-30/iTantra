<svg viewBox="0 0 620 780" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, Segoe UI, Roboto, sans-serif">
  <title>Two modes stacked: walkie-talkie mode and phone mode, each with a phone and a person.</title>
  <desc>Top: walkie-talkie, hold to talk. Bottom: phone mode, call like a normal phone.</desc>

  <rect x="20" y="20" width="580" height="350" rx="20" fill="#EAF2FE"/>
  <rect x="200" y="40" width="210" height="36" rx="18" fill="#3B82F6"/>
  <text x="305" y="64" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Walkie-talkie mode</text>

  <rect x="95" y="100" width="115" height="196" rx="18" fill="#1F2733"/>
  <rect x="105" y="116" width="95" height="164" rx="10" fill="#fff"/>
  <circle cx="152" cy="172" r="26" fill="#3B82F6"/>
  <g stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" transform="translate(152,172)">
    <rect x="-5" y="-10" width="10" height="15" rx="5" fill="#fff" stroke="none"/>
    <path d="M-8,-1 a8,8 0 0 0 16,0"/><line x1="0" y1="7" x2="0" y2="12"/><line x1="-5" y1="12" x2="5" y2="12"/>
  </g>
  <g fill="#93C0F5">
    <rect x="128" y="228" width="4" height="8" rx="2"/><rect x="138" y="222" width="4" height="20" rx="2"/><rect x="148" y="216" width="4" height="32" rx="2"/><rect x="158" y="224" width="4" height="16" rx="2"/><rect x="168" y="230" width="4" height="6" rx="2"/>
  </g>

  <circle cx="440" cy="150" r="35" fill="#33404F"/>
  <circle cx="440" cy="157" r="31" fill="#F2C6A0"/>
  <path d="M394,300 L394,255 Q394,213 440,213 Q486,213 486,255 L486,300 Z" fill="#3B6DB3"/>
  <line x1="412" y1="238" x2="395" y2="178" stroke="#F2C6A0" stroke-width="15" stroke-linecap="round"/>
  <rect x="380" y="160" width="16" height="36" rx="3" fill="#1F2733" transform="rotate(-12,388,178)"/>
  <g stroke="#3B82F6" stroke-width="2" stroke-linecap="round">
    <line x1="360" y1="150" x2="352" y2="146"/><line x1="360" y1="162" x2="351" y2="162"/><line x1="360" y1="174" x2="352" y2="178"/>
  </g>

  <text x="310" y="332" font-size="19" font-weight="700" fill="#1F2A37" text-anchor="middle">Hold to talk, release to listen.</text>
  <text x="310" y="357" font-size="15" fill="#6B7280" text-anchor="middle">Simple. Fast. Reliable.</text>

  <rect x="20" y="410" width="580" height="350" rx="20" fill="#EAF7EE"/>
  <rect x="215" y="430" width="190" height="36" rx="18" fill="#34A853"/>
  <text x="310" y="454" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Phone mode</text>

  <rect x="95" y="490" width="115" height="196" rx="18" fill="#1F2733"/>
  <rect x="105" y="506" width="95" height="164" rx="10" fill="#fff"/>
  <circle cx="152" cy="542" r="22" fill="#34A853"/>
  <g fill="#fff" transform="translate(152,542)"><circle cx="0" cy="-5" r="7"/><path d="M-11,11 q11,-14 22,0 Z"/></g>
  <text x="152" y="582" font-size="12" font-weight="600" fill="#1F2733" text-anchor="middle">Connected</text>
  <text x="152" y="600" font-size="13" fill="#6B7280" text-anchor="middle">00:12</text>
  <g>
    <circle cx="126" cy="632" r="13" fill="#E5E7EB"/>
    <g stroke="#4B5563" stroke-width="1.6" fill="none" stroke-linecap="round" transform="translate(126,632)"><rect x="-3" y="-6" width="6" height="9" rx="3" fill="#4B5563" stroke="none"/><path d="M-5,-1 a5,5 0 0 0 10,0"/><line x1="0" y1="4" x2="0" y2="7"/></g>
    <circle cx="152" cy="632" r="13" fill="#E53935"/>
    <path d="M146,635 a8,8 0 0 1 12,0 l-2,-4 a10,10 0 0 0 -8,0 Z" fill="#fff" transform="rotate(135,152,632)"/>
    <circle cx="178" cy="632" r="13" fill="#E5E7EB"/>
    <g fill="#4B5563" transform="translate(178,632)"><path d="M-5,-3 h4 l4,-3 v12 l-4,-3 h-4 Z"/><path d="M4,-2 a4,4 0 0 1 0,8" fill="none" stroke="#4B5563" stroke-width="1.4"/></g>
  </g>

  <rect x="405" y="536" width="14" height="64" rx="7" fill="#33404F"/>
  <rect x="461" y="536" width="14" height="64" rx="7" fill="#33404F"/>
  <circle cx="440" cy="532" r="36" fill="#33404F"/>
  <circle cx="440" cy="540" r="31" fill="#F2C6A0"/>
  <path d="M396,690 L396,600 Q396,560 440,560 Q484,560 484,600 L484,690 Z" fill="#D6478E"/>
  <line x1="470" y1="600" x2="476" y2="548" stroke="#F2C6A0" stroke-width="15" stroke-linecap="round"/>
  <rect x="466" y="522" width="15" height="40" rx="3" fill="#1F2733" transform="rotate(12,473,542)"/>
  <g stroke="#34A853" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M492,528 a10,10 0 0 1 0,26"/><path d="M500,520 a17,17 0 0 1 0,42"/>
  </g>

  <text x="310" y="722" font-size="19" font-weight="700" fill="#1F2A37" text-anchor="middle">Call like a normal phone.</text>
  <text x="310" y="747" font-size="15" fill="#6B7280" text-anchor="middle">Easy and familiar.</text>
</svg>
