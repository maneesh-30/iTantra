<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, Segoe UI, Roboto, sans-serif">
  <title>EchoWave end-to-end methodology in seven steps across sender phone, the link, and receiver phone.</title>
  <desc>Sender: speak, detect end of speech, speech to text. Link: send text only. Receiver: receive, text to speech, alert handling.</desc>
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1971C2"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2F9E44"/></marker>
  </defs>

  <text x="40" y="40" font-size="18" font-weight="600" fill="#12518F">EchoWave — how it works, end to end</text>

  <rect x="40" y="60" width="300" height="500" rx="16" fill="#F2F7FD" stroke="#1971C2"/>
  <text x="190" y="88" font-size="15" font-weight="600" fill="#12518F" text-anchor="middle">On the sender's phone</text>
  <g font-size="13">
    <rect x="60" y="104" width="260" height="94" rx="10" fill="#fff" stroke="#1971C2"/>
    <circle cx="80" cy="124" r="11" fill="#1971C2"/><text x="80" y="128" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="196" y="130" font-size="14" font-weight="600" fill="#12518F" text-anchor="middle">Speak</text>
    <text x="196" y="150" fill="#5B6B7B" text-anchor="middle">hold Push-to-Talk and talk</text>
    <text x="196" y="168" fill="#5B6B7B" text-anchor="middle">(mic off otherwise)</text>

    <rect x="60" y="218" width="260" height="94" rx="10" fill="#fff" stroke="#1971C2"/>
    <circle cx="80" cy="238" r="11" fill="#1971C2"/><text x="80" y="242" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="196" y="244" font-size="14" font-weight="600" fill="#12518F" text-anchor="middle">Detect end of speech</text>
    <text x="196" y="264" fill="#5B6B7B" text-anchor="middle">VAD (Silero) senses the pause</text>
    <text x="196" y="282" fill="#5B6B7B" text-anchor="middle">= sentence finished</text>

    <rect x="60" y="332" width="260" height="98" rx="10" fill="#fff" stroke="#1971C2"/>
    <circle cx="80" cy="352" r="11" fill="#1971C2"/><text x="80" y="356" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="196" y="358" font-size="14" font-weight="600" fill="#12518F" text-anchor="middle">Speech → Text</text>
    <text x="196" y="378" fill="#5B6B7B" text-anchor="middle">offline STT transcribes the clip</text>
    <text x="196" y="396" fill="#5B6B7B" text-anchor="middle">Moonshine / Whisper / AI4Bharat</text>
  </g>
  <g stroke="#1971C2" stroke-width="2" marker-end="url(#b)">
    <line x1="190" y1="198" x2="190" y2="217"/>
    <line x1="190" y1="312" x2="190" y2="331"/>
  </g>

  <rect x="370" y="60" width="260" height="500" rx="16" fill="#FFFDF5" stroke="#D9A400"/>
  <text x="500" y="88" font-size="15" font-weight="600" fill="#8A6600" text-anchor="middle">Across the link</text>
  <g font-size="13">
    <rect x="388" y="236" width="224" height="128" rx="10" fill="#fff" stroke="#D9A400"/>
    <circle cx="408" cy="258" r="11" fill="#D9A400"/><text x="408" y="262" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="500" y="266" font-size="14" font-weight="600" fill="#8A6600" text-anchor="middle">Send text</text>
    <text x="500" y="286" fill="#5B6B7B" text-anchor="middle">a few bytes, broadcast to</text>
    <text x="500" y="304" fill="#5B6B7B" text-anchor="middle">everyone on the channel</text>
    <text x="500" y="322" fill="#5B6B7B" text-anchor="middle">WiFi / Bluetooth (later: LoRa)</text>
    <text x="500" y="346" font-size="13" font-weight="700" fill="#B0122A" text-anchor="middle">only text — never audio</text>
  </g>

  <rect x="660" y="60" width="300" height="500" rx="16" fill="#F1F9F3" stroke="#2F9E44"/>
  <text x="810" y="88" font-size="15" font-weight="600" fill="#1B6B33" text-anchor="middle">On the receiver's phone</text>
  <g font-size="13">
    <rect x="680" y="104" width="260" height="94" rx="10" fill="#fff" stroke="#2F9E44"/>
    <circle cx="700" cy="124" r="11" fill="#2F9E44"/><text x="700" y="128" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="816" y="130" font-size="14" font-weight="600" fill="#1B6B33" text-anchor="middle">Receive</text>
    <text x="816" y="150" fill="#5B6B7B" text-anchor="middle">gets text on its channel</text>
    <text x="816" y="168" fill="#5B6B7B" text-anchor="middle">ignores own / other channels</text>

    <rect x="680" y="218" width="260" height="94" rx="10" fill="#fff" stroke="#2F9E44"/>
    <circle cx="700" cy="238" r="11" fill="#2F9E44"/><text x="700" y="242" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <text x="816" y="244" font-size="14" font-weight="600" fill="#1B6B33" text-anchor="middle">Text → Speech</text>
    <text x="816" y="264" fill="#5B6B7B" text-anchor="middle">offline TTS (VITS / Piper)</text>
    <text x="816" y="282" fill="#5B6B7B" text-anchor="middle">reads it aloud as a voice note</text>

    <rect x="680" y="332" width="260" height="98" rx="10" fill="#FCEBEB" stroke="#E03131"/>
    <circle cx="700" cy="352" r="11" fill="#E03131"/><text x="700" y="356" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text>
    <text x="816" y="358" font-size="14" font-weight="600" fill="#A32D2D" text-anchor="middle">Alert handling</text>
    <text x="816" y="378" fill="#A32D2D" text-anchor="middle">if marked alert: max volume</text>
    <text x="816" y="396" fill="#A32D2D" text-anchor="middle">and cannot be interrupted</text>
  </g>
  <g stroke="#2F9E44" stroke-width="2" marker-end="url(#g)">
    <line x1="810" y1="198" x2="810" y2="217"/>
    <line x1="810" y1="312" x2="810" y2="331"/>
  </g>

  <line x1="340" y1="300" x2="386" y2="300" stroke="#1971C2" stroke-width="2.5" marker-end="url(#b)"/>
  <line x1="614" y1="300" x2="658" y2="300" stroke="#2F9E44" stroke-width="2.5" marker-end="url(#g)"/>

  <rect x="300" y="512" width="400" height="34" rx="17" fill="#FFF7E6" stroke="#D9A400"/>
  <text x="500" y="534" font-size="14" font-weight="600" fill="#8A6600" text-anchor="middle">text ~80 B  vs  audio ~200 KB  ≈  2500× smaller</text>
</svg>
