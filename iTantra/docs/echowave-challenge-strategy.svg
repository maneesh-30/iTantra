<svg viewBox="0 0 1150 880" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, Segoe UI, Roboto, sans-serif">
  <title>Challenge to Strategy: five engineering challenges each paired with its mitigation.</title>
  <desc>Accuracy, app size, idle battery, background noise, and long-range link, each with a strategy.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9AA3AF"/></marker>
  </defs>

  <text x="20" y="40" font-size="30" font-weight="700" fill="#1F2A37">Challenge</text>
  <line x1="185" y1="30" x2="245" y2="30" stroke="#9AA3AF" stroke-width="3" marker-end="url(#ar)"/>
  <text x="262" y="40" font-size="30" font-weight="700" fill="#6558E0">Strategy</text>

  <g>
    <rect x="10" y="70" width="520" height="130" rx="14" fill="#FCEFEC"/>
    <rect x="600" y="70" width="540" height="130" rx="14" fill="#FDF6F3"/>
    <circle cx="70" cy="135" r="26" fill="#FBE0D6"/>
    <g stroke="#E8663F" stroke-width="2.2" fill="none" stroke-linecap="round" transform="translate(70,135)">
      <circle r="11"/><circle r="5"/><line x1="0" y1="-15" x2="0" y2="-12"/><line x1="0" y1="12" x2="0" y2="15"/><line x1="-15" y1="0" x2="-12" y2="0"/><line x1="12" y1="0" x2="15" y2="0"/>
    </g>
    <text x="120" y="122" font-size="19" font-weight="700" fill="#1F2A37">Accuracy for 10 languages</text>
    <text x="120" y="147" font-size="14" fill="#6B7280">Different languages, different accents,</text>
    <text x="120" y="167" font-size="14" fill="#6B7280">different challenges.</text>
    <line x1="548" y1="135" x2="588" y2="135" stroke="#9AA3AF" stroke-width="2.5" marker-end="url(#ar)"/>
    <circle cx="655" cy="135" r="26" fill="#FBE0D6"/>
    <g stroke="#E8663F" stroke-width="2.2" fill="none" transform="translate(655,135)">
      <rect x="-13" y="-12" width="26" height="10" rx="2"/><rect x="-13" y="2" width="26" height="10" rx="2"/><circle cx="-7" cy="-7" r="1.3" fill="#E8663F"/><circle cx="-7" cy="7" r="1.3" fill="#E8663F"/>
    </g>
    <text x="710" y="118" font-size="19" font-weight="700" fill="#1F2A37">Per-language models</text>
    <text x="710" y="143" font-size="14" fill="#4B5563">•  Force the language per selection</text>
    <text x="710" y="165" font-size="14" fill="#4B5563">•  Measure WER (Word Error Rate)</text>
  </g>

  <g>
    <rect x="10" y="230" width="520" height="130" rx="14" fill="#EEF4FC"/>
    <rect x="600" y="230" width="540" height="130" rx="14" fill="#F5F9FE"/>
    <circle cx="70" cy="295" r="26" fill="#DCEBFB"/>
    <g stroke="#3B82D9" stroke-width="2.2" fill="none" stroke-linecap="round" transform="translate(70,295)">
      <rect x="-9" y="-14" width="18" height="28" rx="3"/><circle cx="0" cy="9" r="1.4" fill="#3B82D9"/>
    </g>
    <text x="120" y="282" font-size="19" font-weight="700" fill="#1F2A37">App / model size on cheap phones</text>
    <text x="120" y="307" font-size="14" fill="#6B7280">Limited storage, low-end hardware,</text>
    <text x="120" y="327" font-size="14" fill="#6B7280">still need good performance.</text>
    <line x1="548" y1="295" x2="588" y2="295" stroke="#9AA3AF" stroke-width="2.5" marker-end="url(#ar)"/>
    <circle cx="655" cy="295" r="26" fill="#DCEBFB"/>
    <g stroke="#3B82D9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(655,295)">
      <line x1="0" y1="-13" x2="0" y2="6"/><polyline points="-6,0 0,6 6,0"/><line x1="-11" y1="11" x2="11" y2="11"/>
    </g>
    <text x="710" y="290" font-size="19" font-weight="700" fill="#1F2A37">Int8 quantization +</text>
    <text x="710" y="316" font-size="19" font-weight="700" fill="#1F2A37">on-demand per-language download</text>
  </g>

  <g>
    <rect x="10" y="390" width="520" height="130" rx="14" fill="#F0EEFC"/>
    <rect x="600" y="390" width="540" height="130" rx="14" fill="#F6F5FD"/>
    <circle cx="70" cy="455" r="26" fill="#E5E1FA"/>
    <g stroke="#7C6CE4" stroke-width="2.2" fill="none" stroke-linecap="round" transform="translate(70,455)">
      <rect x="-14" y="-8" width="24" height="16" rx="3"/><rect x="10" y="-4" width="4" height="8" rx="1" fill="#7C6CE4" stroke="none"/><rect x="-11" y="-5" width="9" height="10" rx="1" fill="#7C6CE4" stroke="none"/>
    </g>
    <text x="120" y="442" font-size="19" font-weight="700" fill="#1F2A37">Idle battery / CPU</text>
    <text x="120" y="467" font-size="14" fill="#6B7280">Continuous listening drains battery</text>
    <text x="120" y="487" font-size="14" fill="#6B7280">and keeps the CPU busy.</text>
    <line x1="548" y1="455" x2="588" y2="455" stroke="#9AA3AF" stroke-width="2.5" marker-end="url(#ar)"/>
    <circle cx="655" cy="455" r="26" fill="#E5E1FA"/>
    <g stroke="#7C6CE4" stroke-width="2.2" fill="none" stroke-linecap="round" transform="translate(655,455)">
      <rect x="-5" y="-14" width="10" height="18" rx="5"/><path d="M-9,0 a9,9 0 0 0 18,0"/><line x1="0" y1="9" x2="0" y2="14"/><line x1="-6" y1="14" x2="6" y2="14"/>
    </g>
    <text x="710" y="438" font-size="19" font-weight="700" fill="#1F2A37">Push-to-talk</text>
    <text x="710" y="463" font-size="14" fill="#4B5563">•  Keeps mic &amp; models off when idle</text>
    <text x="710" y="485" font-size="14" fill="#4B5563">•  Near-zero idle CPU</text>
  </g>

  <g>
    <rect x="10" y="550" width="520" height="130" rx="14" fill="#EEF6EE"/>
    <rect x="600" y="550" width="540" height="130" rx="14" fill="#F5FAF5"/>
    <circle cx="70" cy="615" r="26" fill="#DDF0DE"/>
    <g stroke="#4FA05A" stroke-width="2.4" stroke-linecap="round" transform="translate(70,615)">
      <line x1="-12" y1="-4" x2="-12" y2="4"/><line x1="-6" y1="-10" x2="-6" y2="10"/><line x1="0" y1="-14" x2="0" y2="14"/><line x1="6" y1="-8" x2="6" y2="8"/><line x1="12" y1="-5" x2="12" y2="5"/>
    </g>
    <text x="120" y="602" font-size="19" font-weight="700" fill="#1F2A37">Background noise</text>
    <text x="120" y="627" font-size="14" fill="#6B7280">Noise, crowds, wind — all reduce</text>
    <text x="120" y="647" font-size="14" fill="#6B7280">speech clarity.</text>
    <line x1="548" y1="615" x2="588" y2="615" stroke="#9AA3AF" stroke-width="2.5" marker-end="url(#ar)"/>
    <circle cx="655" cy="615" r="26" fill="#DDF0DE"/>
    <g stroke="#4FA05A" stroke-width="2.4" stroke-linecap="round" transform="translate(655,615)">
      <line x1="-13" y1="-3" x2="-13" y2="3"/><line x1="-7" y1="-9" x2="-7" y2="9"/><line x1="-1" y1="-13" x2="-1" y2="13"/><path d="M4,-4 L8,0 L4,4 L0,0 Z" fill="#4FA05A" stroke="none"/><line x1="13" y1="-6" x2="13" y2="6"/>
    </g>
    <text x="710" y="608" font-size="19" font-weight="700" fill="#1F2A37">PTT gating + VAD thresholds +</text>
    <text x="710" y="634" font-size="19" font-weight="700" fill="#1F2A37">noise suppression</text>
  </g>

  <g>
    <rect x="10" y="710" width="520" height="130" rx="14" fill="#ECF7F5"/>
    <rect x="600" y="710" width="540" height="130" rx="14" fill="#F4FBF9"/>
    <circle cx="70" cy="775" r="26" fill="#D6F0EC"/>
    <g stroke="#2FA79A" stroke-width="2.2" fill="none" stroke-linecap="round" transform="translate(70,775)">
      <line x1="0" y1="-2" x2="0" y2="14"/><path d="M-11,10 L0,-2 L11,10"/><path d="M-7,-8 a10,10 0 0 1 14,0"/><path d="M-12,-13 a17,17 0 0 1 24,0"/>
    </g>
    <text x="120" y="762" font-size="19" font-weight="700" fill="#1F2A37">Real long-range link</text>
    <text x="120" y="787" font-size="14" fill="#6B7280">Need to go beyond WiFi/Bluetooth</text>
    <text x="120" y="807" font-size="14" fill="#6B7280">for true long-range communication.</text>
    <line x1="548" y1="775" x2="588" y2="775" stroke="#9AA3AF" stroke-width="2.5" marker-end="url(#ar)"/>
    <circle cx="655" cy="775" r="26" fill="#D6F0EC"/>
    <g stroke="#2FA79A" stroke-width="2.2" fill="none" transform="translate(655,775)">
      <circle cx="-10" cy="0" r="4"/><circle cx="9" cy="-9" r="4"/><circle cx="9" cy="9" r="4"/><line x1="-6.5" y1="-2" x2="5.5" y2="-8"/><line x1="-6.5" y1="2" x2="5.5" y2="8"/>
    </g>
    <text x="710" y="758" font-size="19" font-weight="700" fill="#1F2A37">Abstract transport</text>
    <text x="710" y="783" font-size="14" fill="#4B5563">•  Drop in LoRa / Meshtastic</text>
    <text x="710" y="805" font-size="14" fill="#4B5563">•  No app change</text>
  </g>
</svg>
